<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded app tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1d4ed8"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Whiteboard surface -->
  <rect x="24" y="30" width="80" height="60" rx="8" fill="#f8fafc"/>

  <!-- Graph: three connected nodes on the board (architecture diagram motif) -->
  <!-- edges first so nodes sit on top -->
  <g stroke="#1d4ed8" stroke-width="4" stroke-linecap="round">
    <line x1="44" y1="48" x2="84" y2="48"/>
    <line x1="44" y1="48" x2="64" y2="74"/>
    <line x1="84" y1="48" x2="64" y2="74"/>
  </g>
  <g fill="#1d4ed8">
    <circle cx="44" cy="48" r="9"/>
    <circle cx="84" cy="48" r="9"/>
    <circle cx="64" cy="74" r="9"/>
  </g>
  <!-- node highlights -->
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="44" cy="48" r="3.2"/>
    <circle cx="84" cy="48" r="3.2"/>
    <circle cx="64" cy="74" r="3.2"/>
  </g>

  <!-- Marker pen resting on the board tray -->
  <rect x="24" y="90" width="80" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="70" y="84" width="26" height="8" rx="4" transform="rotate(-8 83 88)" fill="#f59e0b"/>
</svg>
